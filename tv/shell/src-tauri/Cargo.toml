[package]
name = "lumen-tv"
version = "0.6.0"
description = "Redline for Google TV / Android TV: a thin Tauri shell around the shared client"
authors = ["Redline"]
license = "MIT"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "lumen_tv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde_json = "1.0"
log = "0.4"
tauri-plugin-log = "2"
lumen-tv-core = { path = "../../core" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
